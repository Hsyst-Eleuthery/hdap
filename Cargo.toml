[workspace]
resolver = "2"
members = [
    "crates/hdap-core",
    "crates/hdap-server",
    "crates/hdap-cli",
    "crates/hdap-tls",
    "crates/hdap-gui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Thaís (op3n/op3ny) <thais@hsyst.org>"]
repository = "https://github.com/Hsyst-Eleuthery/hdap"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS de base (AME-09): rustls para transporte e rcgen para a chave/cert
# auto-assinada Ed25519 que cada pyle gera (assinada pela própria identidade).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"
rustls-pemfile = "2"

[profile.release]
lto = true